name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint install script
        run: shellcheck -s sh src/kya/install.sh

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli@0.89.0

      - name: Run autogenerated feature test
        run: devcontainer features test -f kya -i mcr.microsoft.com/devcontainers/base:ubuntu .

      - name: Run scenario tests
        run: devcontainer features test --global-scenarios-only -i mcr.microsoft.com/devcontainers/base:ubuntu .
